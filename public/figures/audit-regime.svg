<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244" role="img" aria-label="Where the flagship's missing points come from" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="0" y="16" fill="#ededed" font-size="14" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >1-bit flagship: score of 78, by regime</text>
<text x="0" y="36" fill="#7d7d7d" font-size="12" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >Extra room alone buys +3. Letting it deliberate buys +17.</text>
<text x="0" y="58" fill="#7d7d7d" font-size="12" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >The vendor benchmarks in the last column. A phone runs the first.</text>
<rect x="8" y="124.4" width="116" height="75.6" fill="#3d3d3d" rx="2"/>
<text x="66.0" y="115.4" fill="#ededed" font-size="14" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >56</text>
<text x="66.0" y="220" fill="#7d7d7d" font-size="12" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >Fast answer</text>
<rect x="158" y="120.3" width="116" height="79.7" fill="#5a5344" rx="2"/>
<text x="216.0" y="111.35" fill="#ededed" font-size="14" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >59</text>
<text x="216.0" y="220" fill="#7d7d7d" font-size="12" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >+ room to answer</text>
<line x1="124" y1="124.4" x2="158" y2="124.4" stroke="#4a4a4a" stroke-dasharray="3 3"/>
<text x="141.0" y="115.4" fill="#d2a24c" font-size="12.5" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >+3</text>
<rect x="308" y="97.4" width="116" height="102.6" fill="#d2a24c" rx="2"/>
<text x="366.0" y="88.4" fill="#d2a24c" font-size="14" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >76</text>
<text x="366.0" y="220" fill="#7d7d7d" font-size="12" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >+ deliberation</text>
<line x1="274" y1="120.3" x2="308" y2="120.3" stroke="#4a4a4a" stroke-dasharray="3 3"/>
<text x="291.0" y="111.35" fill="#d2a24c" font-size="12.5" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >+17</text>
<line x1="8" y1="200" x2="424" y2="200" stroke="#2a2a2a"/>
<text x="0" y="238" fill="#7d7d7d" font-size="11.5" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >Both sides' numbers were true. They measured different regimes.</text>
</svg>
