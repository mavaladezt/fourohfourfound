<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-label="Energy efficiency inverts between devices" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="0" y="16" fill="#ededed" font-size="14" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >Efficiency: tokens per joule (SoC estimate)</text>
<text x="0" y="36" fill="#7d7d7d" font-size="12" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >Same model files, same software, two Apple machines one generation apart.</text>
<rect x="0" y="55" width="14" height="3" fill="#d2a24c" rx="1.5"/>
<text x="22" y="61" fill="#d2a24c" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >M5</text>
<text x="48" y="61" fill="#7d7d7d" font-size="11.5" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >— faster, less efficient</text>
<rect x="250" y="55" width="14" height="3" fill="#8a8a8a" rx="1.5"/>
<text x="272" y="61" fill="#8a8a8a" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >M4</text>
<text x="298" y="61" fill="#7d7d7d" font-size="11.5" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >— faster and more efficient</text>
<line x1="46" y1="216.0" x2="614" y2="216.0" stroke="#2a2a2a"/>
<text x="36" y="220.0" fill="#4a4a4a" font-size="11" text-anchor="end" font-weight="400" style="font-variant-numeric:tabular-nums" >0</text>
<line x1="46" y1="171.9" x2="614" y2="171.9" stroke="#2a2a2a"/>
<text x="36" y="175.9322033898305" fill="#4a4a4a" font-size="11" text-anchor="end" font-weight="400" style="font-variant-numeric:tabular-nums" >2</text>
<line x1="46" y1="127.9" x2="614" y2="127.9" stroke="#2a2a2a"/>
<text x="36" y="131.864406779661" fill="#4a4a4a" font-size="11" text-anchor="end" font-weight="400" style="font-variant-numeric:tabular-nums" >4</text>
<text x="46.0" y="238" fill="#7d7d7d" font-size="12.5" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >FP16</text>
<text x="330.0" y="238" fill="#7d7d7d" font-size="12.5" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >Q4</text>
<text x="614.0" y="238" fill="#7d7d7d" font-size="12.5" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums" >Q2</text>
<polyline points="46.0,105.4 330.0,115.5 614.0,127.6" fill="none" stroke="#d2a24c" stroke-width="2"/>
<circle cx="46.0" cy="105.4" r="3.5" fill="#d2a24c"/>
<text x="54.0" y="93.3898305084746" fill="#d2a24c" font-size="11.5" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >5.02</text>
<circle cx="330.0" cy="115.5" r="3.5" fill="#d2a24c"/>
<text x="330.0" y="103.52542372881358" fill="#d2a24c" font-size="11.5" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >4.56</text>
<circle cx="614.0" cy="127.6" r="3.5" fill="#d2a24c"/>
<text x="606.0" y="115.64406779661019" fill="#d2a24c" font-size="11.5" text-anchor="end" font-weight="600" style="font-variant-numeric:tabular-nums" >4.01</text>
<polyline points="46.0,172.4 330.0,137.6 614.0,132.7" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<circle cx="46.0" cy="172.4" r="3.5" fill="#8a8a8a"/>
<text x="54.0" y="192.3728813559322" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-weight="600" style="font-variant-numeric:tabular-nums" >1.98</text>
<circle cx="330.0" cy="137.6" r="3.5" fill="#8a8a8a"/>
<text x="330.0" y="157.5593220338983" fill="#8a8a8a" font-size="11.5" text-anchor="middle" font-weight="600" style="font-variant-numeric:tabular-nums" >3.56</text>
<circle cx="614.0" cy="132.7" r="3.5" fill="#8a8a8a"/>
<text x="606.0" y="152.71186440677968" fill="#8a8a8a" font-size="11.5" text-anchor="end" font-weight="600" style="font-variant-numeric:tabular-nums" >3.78</text>
<text x="0" y="256" fill="#7d7d7d" font-size="11.5" text-anchor="start" font-weight="400" style="font-variant-numeric:tabular-nums" >Shrinking the model moves efficiency in opposite directions on the two chips.</text>
</svg>
